name: Nanvix CI

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - nanvix/**
  pull_request:
    branches:
      - nanvix/**
  workflow_dispatch:
  repository_dispatch:
    types: [nanvix-minor-release, nanvix-major-release]

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: hyperlight
            process-mode: multi-process
            runner: self-hosted-hyperlight-multi
          - platform: hyperlight
            process-mode: single-process
            runner: self-hosted-hyperlight-single
          - platform: microvm
            process-mode: single-process
            runner: self-hosted-microvm-single
          - platform: microvm
            process-mode: multi-process
            runner: self-hosted-microvm-multi
    name: ${{ matrix.platform }}-${{ matrix.process-mode }}
    steps:
      - uses: actions/checkout@v4

      - name: Download and Extract Nanvix Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          API_URL="https://api.github.com/repos/nanvix/nanvix/releases/tags/latest"
          ARTIFACT_PATTERN="${{ matrix.platform }}.*${{ matrix.process-mode }}.*\\.tar\\.bz2$"
          ARTIFACT_URL=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" "$API_URL" | \
            jq -r --arg pattern "$ARTIFACT_PATTERN" '.assets[] | select(.name | test($pattern)) | .browser_download_url' | head -1)
          if [[ -z "$ARTIFACT_URL" ]]; then
            echo "::error::No ${{ matrix.platform }} ${{ matrix.process-mode }} artifact found"
            exit 1
          fi
          mkdir -p nanvix-artifacts
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" "$ARTIFACT_URL" -o nanvix-artifacts/release.tar.bz2
          mkdir -p nanvix-artifacts/extracted
          tar -xjf nanvix-artifacts/release.tar.bz2 -C nanvix-artifacts/extracted
          NANVIX_HOME=$(find nanvix-artifacts/extracted -maxdepth 2 -type d -name "bin" -exec dirname {} \; | head -1)
          echo "NANVIX_HOME=$NANVIX_HOME" >> "$GITHUB_ENV"

      - name: Build
        run: |
          make CONFIG_NANVIX=y NANVIX_HOME="$NANVIX_HOME" NANVIX_TOOLCHAIN="$HOME/toolchain" all

      - name: Test
        run: |
          make CONFIG_NANVIX=y NANVIX_HOME="$NANVIX_HOME" NANVIX_TOOLCHAIN="$HOME/toolchain" test

      - name: Cleanup
        if: always()
        run: sudo find /tmp -maxdepth 1 -type d -name 'nvx:*' -exec rm -rf {} + 2>/dev/null || true

  report-minor-release-failure:
    needs:
      - build
    if: >-
      ${{ always() && github.event_name == 'repository_dispatch' &&
          (github.event.action == 'nanvix-minor-release' || github.event.action == 'nanvix-major-release') &&
          needs.build.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Create failure issue
        uses: actions/github-script@v7
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const isMajor = context.payload.action === 'nanvix-major-release';
            const releaseType = isMajor ? 'major' : 'minor';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = `Nanvix ${releaseType} release CI failure (run ${context.runNumber})`;
            const body = [
              `The Nanvix ${releaseType} release CI workflow failed.`,
              `- Run: [#${context.runNumber}](${runUrl})`,
              `- SHA: ${context.sha}`,
              `- build: ${process.env.BUILD_RESULT}`,
              '',
              'Please investigate and take any corrective actions.'
            ].join('\n');
            await github.rest.issues.create({
              owner,
              repo,
              title,
              body,
              assignees: ['ppenna']
            });
