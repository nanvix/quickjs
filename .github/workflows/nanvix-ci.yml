name: Nanvix CI

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - nanvix/**
  pull_request:
    branches:
      - nanvix/**
  workflow_dispatch:
  repository_dispatch:
    types: [nanvix-minor-release, nanvix-major-release]

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  build:
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: hyperlight
            process-mode: multi-process
          - platform: hyperlight
            process-mode: single-process
          - platform: microvm
            process-mode: single-process
          - platform: microvm
            process-mode: multi-process
    name: ${{ matrix.platform }}-${{ matrix.process-mode }}
    steps:
      - uses: actions/checkout@v4

      - name: Download and Extract Nanvix Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          API_URL="https://api.github.com/repos/nanvix/nanvix/releases/tags/latest"
          ARTIFACT_PATTERN="${{ matrix.platform }}.*${{ matrix.process-mode }}.*\\.tar\\.bz2$"
          ARTIFACT_URL=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" "$API_URL" | \
            jq -r --arg pattern "$ARTIFACT_PATTERN" '.assets[] | select(.name | test($pattern)) | .browser_download_url' | head -1)
          if [[ -z "$ARTIFACT_URL" ]]; then
            echo "::error::No ${{ matrix.platform }} ${{ matrix.process-mode }} artifact found"
            exit 1
          fi
          mkdir -p nanvix-artifacts
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" "$ARTIFACT_URL" -o nanvix-artifacts/release.tar.bz2
          mkdir -p nanvix-artifacts/extracted
          tar -xjf nanvix-artifacts/release.tar.bz2 -C nanvix-artifacts/extracted
          NANVIX_HOME=$(find nanvix-artifacts/extracted -maxdepth 2 -type d -name "bin" -exec dirname {} \; | head -1)
          echo "NANVIX_HOME=$NANVIX_HOME" >> "$GITHUB_ENV"

      - name: Build
        run: |
          make CONFIG_NANVIX=y NANVIX_HOME="$NANVIX_HOME" NANVIX_TOOLCHAIN="$HOME/toolchain" all

      - name: Test
        run: |
          make CONFIG_NANVIX=y NANVIX_HOME="$NANVIX_HOME" NANVIX_TOOLCHAIN="$HOME/toolchain" test

      - name: Package Artifacts
        run: |
          set -euo pipefail
          ARTIFACT_NAME="quickjs-${{ matrix.platform }}-${{ matrix.process-mode }}"
          DIST_DIR="dist/${ARTIFACT_NAME}"
          mkdir -p "${DIST_DIR}/bin" "${DIST_DIR}/lib/quickjs" "${DIST_DIR}/include/quickjs"
          # Copy executables
          cp -f qjs "${DIST_DIR}/bin/" 2>/dev/null || true
          cp -f qjsc "${DIST_DIR}/bin/" 2>/dev/null || true
          # Copy libraries
          cp -f libquickjs.a "${DIST_DIR}/lib/quickjs/" 2>/dev/null || true
          cp -f libquickjs.lto.a "${DIST_DIR}/lib/quickjs/" 2>/dev/null || true
          # Copy headers
          cp -f quickjs.h quickjs-libc.h "${DIST_DIR}/include/quickjs/"
          # Create tarball
          tar -cjf "dist/${ARTIFACT_NAME}.tar.bz2" -C dist "${ARTIFACT_NAME}"
          echo "ARTIFACT_TARBALL=dist/${ARTIFACT_NAME}.tar.bz2" >> "$GITHUB_ENV"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quickjs-${{ matrix.platform }}-${{ matrix.process-mode }}
          path: ${{ env.ARTIFACT_TARBALL }}
          retention-days: 7

      - name: Cleanup
        if: always()
        run: sudo find /tmp -maxdepth 1 -type d -name 'nvx:*' -exec rm -rf {} + 2>/dev/null || true

  release:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: quickjs-*

      - name: Prepare Release Assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find release-artifacts -name "*.tar.bz2" -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Get Nanvix Release Info
        id: nanvix-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          API_URL="https://api.github.com/repos/nanvix/nanvix/releases/tags/latest"
          RELEASE_INFO=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" "$API_URL")
          NANVIX_NAME=$(echo "$RELEASE_INFO" | jq -r '.name // "latest"')
          NANVIX_PUBLISHED=$(echo "$RELEASE_INFO" | jq -r '.published_at')
          NANVIX_SHA=$(echo "$RELEASE_INFO" | jq -r '.target_commitish')
          NANVIX_ID=$(echo "$RELEASE_INFO" | jq -r '.id')
          echo "name=${NANVIX_NAME}" >> "$GITHUB_OUTPUT"
          echo "published=${NANVIX_PUBLISHED}" >> "$GITHUB_OUTPUT"
          echo "sha=${NANVIX_SHA}" >> "$GITHUB_OUTPUT"
          echo "id=${NANVIX_ID}" >> "$GITHUB_OUTPUT"

      - name: Create Latest Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NANVIX_NAME: ${{ steps.nanvix-release.outputs.name }}
          NANVIX_PUBLISHED: ${{ steps.nanvix-release.outputs.published }}
          NANVIX_SHA: ${{ steps.nanvix-release.outputs.sha }}
        run: |
          RELEASE_TAG="build-$(date -u +"%Y%m%d-%H%M%S")-${GITHUB_SHA::7}"
          gh release create "$RELEASE_TAG" \
            --title "Build ${RELEASE_TAG}" \
            --notes "Automated build from branch ${{ github.ref_name }} at commit ${{ github.sha }}.

          **Build Information:**
          - Workflow Run: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          - Commit: ${{ github.sha }}
          - Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")

          **Nanvix Release:**
          - Name: ${NANVIX_NAME}
          - Published: ${NANVIX_PUBLISHED}
          - Commit: [${NANVIX_SHA::7}](https://github.com/nanvix/nanvix/commit/${NANVIX_SHA})

          **Included Artifacts:**
          - \`quickjs-hyperlight-multi-process.tar.bz2\` - QuickJS for Hyperlight (multi-process)
          - \`quickjs-hyperlight-single-process.tar.bz2\` - QuickJS for Hyperlight (single-process)
          - \`quickjs-microvm-multi-process.tar.bz2\` - QuickJS for MicroVM (multi-process)
          - \`quickjs-microvm-single-process.tar.bz2\` - QuickJS for MicroVM (single-process)

          Each tarball contains:
          - \`bin/\` - Executables (qjs, qjsc)
          - \`lib/quickjs/\` - Static libraries (libquickjs.a)
          - \`include/quickjs/\` - Header files (quickjs.h, quickjs-libc.h)" \
            --latest \
            release-assets/*.tar.bz2

  report-minor-release-failure:
    needs:
      - build
    if: >-
      ${{ always() && github.event_name == 'repository_dispatch' &&
          (github.event.action == 'nanvix-minor-release' || github.event.action == 'nanvix-major-release') &&
          needs.build.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Create failure issue
        uses: actions/github-script@v7
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const isMajor = context.payload.action === 'nanvix-major-release';
            const releaseType = isMajor ? 'major' : 'minor';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = `Nanvix ${releaseType} release CI failure (run ${context.runNumber})`;
            const body = [
              `The Nanvix ${releaseType} release CI workflow failed.`,
              `- Run: [#${context.runNumber}](${runUrl})`,
              `- SHA: ${context.sha}`,
              `- build: ${process.env.BUILD_RESULT}`,
              '',
              'Please investigate and take any corrective actions.'
            ].join('\n');
            await github.rest.issues.create({
              owner,
              repo,
              title,
              body,
              assignees: ['ppenna']
            });
